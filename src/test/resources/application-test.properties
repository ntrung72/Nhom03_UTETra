spring.datasource.url=jdbc:h2:mem:utetra;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
app.seed-data=false
spring.mail.username=
spring.mail.password=

app.remember-me.key=utetra-test-only-remember-me-key
spring.jpa.properties.hibernate.use_nationalized_character_data=false
