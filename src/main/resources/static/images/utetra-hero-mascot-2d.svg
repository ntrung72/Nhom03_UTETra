<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 550" role="img" aria-labelledby="title desc">
  <title id="title">Linh vật trà sữa UTETra</title>
  <desc id="desc">Một ly trà sữa hoạt hình hai chiều đội mũ tốt nghiệp, má hồng, vẫy tay và mang những hạt trân châu.</desc>
  <defs>
    <clipPath id="cup-shape">
      <path d="M122 171 Q119 155 136 151 Q239 137 344 151 Q361 155 358 171 L333 439 Q330 474 297 483 Q240 495 183 483 Q150 474 147 439 Z"/>
    </clipPath>
  </defs>

  <!-- Arms and legs sit behind the cup so the outline stays clean. -->
  <g fill="none" stroke="#202b39" stroke-linecap="round" stroke-linejoin="round">
    <path d="M150 273 Q113 268 91 230" stroke-width="23" transform="translate(-10 0)"/>
    <path d="M338 283 Q380 278 396 315" stroke-width="23" transform="translate(-8 10)"/>
    <path d="M197 466 Q192 491 184 506 M282 466 Q289 491 297 506" stroke-width="20"/>
  </g>
  <g fill="#fff1d0" stroke="#202b39" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
