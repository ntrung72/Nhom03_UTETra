      <circle cx="269" cy="423" r="15"/><circle cx="314" cy="403" r="14"/>
      <circle cx="198" cy="455" r="14"/><circle cx="246" cy="452" r="15"/>
      <circle cx="296" cy="453" r="14"/><circle cx="333" cy="432" r="12"/>
    </g>
