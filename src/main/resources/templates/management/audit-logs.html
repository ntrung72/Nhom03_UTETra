<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Nhật ký thao tác')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main class="container py-4">
    <div th:replace="~{fragments/management-nav :: nav}"></div>
    <div th:replace="~{fragments/layout :: flash}"></div>
    <div class="mb-4"><span class="page-kicker"><i class="bi bi-shield-check"></i> Bảo mật & quản trị</span><h1 class="h3 mb-1">Nhật ký thao tác</h1><p class="text-muted mb-0">Theo dõi ai đã thay đổi tài khoản, cửa hàng và đơn hàng, vào thời điểm nào.</p></div>
    <form class="card p-3 mb-3" method="get" th:action="@{/management/audit-logs}">
        <div class="row g-2 align-items-end">
            <div class="col-md-5"><label class="form-label" for="auditQuery">Tài khoản hoặc đối tượng</label><input class="form-control" id="auditQuery" name="q" th:value="${q}" placeholder="Tên tài khoản, shop hoặc mã đơn"></div>
            <div class="col-md-5"><label class="form-label" for="auditAction">Hành động</label><select class="form-select" id="auditAction" name="action"><option value="">Tất cả hành động</option><option th:each="item : ${actions}" th:value="${item}" th:selected="${item == selectedAction}" th:text="${item.label}"></option></select></div>
            <div class="col-md-2"><button class="btn btn-primary w-100">Lọc</button></div>
        </div>
    </form>
    <div class="card table-responsive">
        <table class="table align-middle mb-0">
            <thead><tr><th>Thời gian</th><th>Người thực hiện</th><th>Hành động</th><th>Đối tượng</th><th>Trước → Sau</th><th>Ghi chú</th></tr></thead>
            <tbody>
            <tr th:each="entry : ${logs.content}">
                <td class="text-nowrap" th:text="${#temporals.format(entry.createdAt, 'dd/MM/yyyy HH:mm:ss')}"></td>
                <td><b th:text="${entry.actorUsername}"></b><small class="d-block text-muted" th:text="${entry.actorRole.label}"></small></td>
                <td><span class="badge text-bg-light border" th:text="${entry.action.label}"></span></td>
                <td><b th:text="${entry.targetLabel}"></b><small class="d-block text-muted" th:text="|${entry.targetType == 'USER' ? 'Tài khoản' : (entry.targetType == 'SHOP' ? 'Cửa hàng' : 'Đơn hàng')} #${entry.targetId}|"></small></td>
                <td><span th:text="${entry.oldValue ?: '—'}"></span><span class="mx-1 text-muted">→</span><b th:text="${entry.newValue ?: '—'}"></b></td>
                <td class="small text-muted" th:text="${entry.note ?: '—'}"></td>
            </tr>
            <tr th:if="${logs.empty}"><td colspan="6" class="text-center text-muted py-4">Chưa có thao tác phù hợp.</td></tr>
            </tbody>
        </table>
    </div>
    <nav class="mt-3" th:if="${logs.totalPages > 1}" aria-label="Phân trang nhật ký"><ul class="pagination justify-content-center">
        <li class="page-item" th:classappend="${logs.first} ? 'disabled'"><a class="page-link" th:href="@{/management/audit-logs(page=${logs.number - 1},q=${q},action=${selectedAction})}">Trước</a></li>
        <li class="page-item" th:each="i : ${#numbers.sequence(0, logs.totalPages - 1)}" th:classappend="${i == logs.number} ? 'active'"><a class="page-link" th:href="@{/management/audit-logs(page=${i},q=${q},action=${selectedAction})}" th:text="${i + 1}"></a></li>
        <li class="page-item" th:classappend="${logs.last} ? 'disabled'"><a class="page-link" th:href="@{/management/audit-logs(page=${logs.number + 1},q=${q},action=${selectedAction})}">Sau</a></li>
    </ul></nav>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
