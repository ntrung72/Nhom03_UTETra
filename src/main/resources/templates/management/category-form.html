<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Danh mục')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main class="container py-4 management-page">
    <div class="admin-dashboard-shell">
        <div th:replace="~{fragments/management-nav :: nav}"></div>
        <div class="admin-dashboard-content">
    <div th:replace="~{fragments/layout :: flash}"></div>
    <div class="card p-4">
        <h1 class="h3" th:text="${category == null ? 'Thêm danh mục' : 'Sửa danh mục'}"></h1>
        <form th:action="@{/management/categories/save}" th:object="${categoryForm}" method="post" enctype="multipart/form-data">
            <input type="hidden" name="id" th:value="${category?.id}">
            <label class="form-label">Tên danh mục</label>
            <input class="form-control" th:field="*{name}">
            <div class="text-danger mb-3" th:errors="*{name}"></div>
            <label class="form-label">Mô tả</label>
            <textarea class="form-control" rows="4" th:field="*{description}"></textarea>
            <div class="text-danger mb-3" th:errors="*{description}"></div>
            <label class="form-label">Ảnh danh mục</label>
            <input class="form-control mb-3" type="file" name="image" accept="image/jpeg,image/png,image/webp">
            <small class="text-muted d-block mb-3">JPG, PNG hoặc WEBP; tối đa 10 MB.</small>
            <div class="form-check"><input class="form-check-input" type="checkbox" th:field="*{active}"><label class="form-check-label">Hoạt động</label></div>
            <button class="btn btn-primary mt-3">Lưu danh mục</button>
        </form>
    </div>
        </div>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
