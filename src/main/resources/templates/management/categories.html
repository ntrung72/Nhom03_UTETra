<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Danh mục')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main class="container py-4 management-page">
    <div class="admin-dashboard-shell">
        <div th:replace="~{fragments/management-nav :: nav}"></div>
        <div class="admin-dashboard-content">
    <div th:replace="~{fragments/layout :: flash}"></div>
    <div class="d-flex justify-content-between align-items-center">
        <h1 class="h3">Quản lý danh mục</h1>
        <a class="btn btn-primary" th:href="@{/management/categories/new}">Thêm danh mục</a>
    </div>
    <form class="my-3" method="get">
        <div class="input-group">
            <input class="form-control" name="q" th:value="${q}" placeholder="Tìm tên danh mục">
            <button class="btn btn-outline-primary">Tìm kiếm</button>
        </div>
    </form>
    <div class="card table-responsive">
        <table class="table align-middle mb-0">
            <thead><tr><th>Danh mục</th><th>Trạng thái</th><th></th></tr></thead>
            <tbody>
            <tr th:each="c : ${categories.content}">
                <td><strong th:text="${c.name}"></strong><div class="text-muted" th:text="${c.description}"></div></td>
                <td th:text="${c.active ? 'Hoạt động' : 'Đã ẩn'}"></td>
                <td class="text-nowrap">
                    <a class="btn btn-sm btn-outline-primary" th:href="@{/management/categories/{id}/edit(id=${c.id})}">Sửa</a>
                    <form class="d-inline" th:action="@{/management/categories/{id}/toggle(id=${c.id})}" method="post"><button class="btn btn-sm btn-outline-warning" th:text="${c.active ? 'Ẩn' : 'Hiện'}"></button></form>
                </td>
            </tr>
            <tr th:if="${categories.empty}"><td colspan="3" class="text-center text-muted py-4">Không tìm thấy danh mục.</td></tr>
            </tbody>
        </table>
    </div>
    <nav class="mt-3" th:if="${categories.totalPages > 1}">
        <ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${categories.first} ? 'disabled'"><a class="page-link" th:href="@{/management/categories(page=${categories.number - 1},q=${q})}">Trước</a></li>
            <li class="page-item" th:each="i : ${#numbers.sequence(0, categories.totalPages - 1)}" th:classappend="${i == categories.number} ? 'active'"><a class="page-link" th:href="@{/management/categories(page=${i},q=${q})}" th:text="${i + 1}"></a></li>
            <li class="page-item" th:classappend="${categories.last} ? 'disabled'"><a class="page-link" th:href="@{/management/categories(page=${categories.number + 1},q=${q})}">Sau</a></li>
        </ul>
    </nav>
        </div>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
