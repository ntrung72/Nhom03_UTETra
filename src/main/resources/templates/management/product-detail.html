<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Chi tiết sản phẩm')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main class="container py-4">
    <div th:replace="~{fragments/management-nav :: nav}"></div>
    <div th:replace="~{fragments/layout :: flash}"></div>
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
        <div><span class="page-kicker"><i class="bi bi-cup-straw"></i> CHI TIẾT SẢN PHẨM</span><h1 class="h3 mb-1" th:text="${product.name}"></h1><p class="text-muted mb-0" th:text="${product.shop.name + ' · ' + product.sku}"></p></div>
        <div class="d-flex gap-2"><a class="btn btn-light" th:href="@{/management/products}"><i class="bi bi-arrow-left"></i> Quay lại</a><a class="btn btn-primary" th:href="@{/management/products/{id}/edit(id=${product.id})}"><i class="bi bi-pencil"></i> Chỉnh sửa</a></div>
    </div>
    <div class="row g-4">
        <div class="col-lg-5">
            <section class="card p-3 h-100">
                <img class="img-fluid rounded-4 border mb-3" th:src="${product.imageUrl}" th:alt="${product.name}">
                <div class="row g-2" th:if="${gallery.size() > 1}"><div class="col-3" th:each="photo : ${gallery}"><img class="img-fluid rounded-3 border" th:src="${photo.imageUrl}" alt="Ảnh sản phẩm"></div></div>
            </section>
        </div>
        <div class="col-lg-7">
            <section class="card p-4 mb-4">
                <div class="row g-3">
                    <div class="col-sm-6"><small class="text-muted d-block">Cửa hàng</small><strong th:text="${product.shop.name}"></strong></div>
                    <div class="col-sm-6"><small class="text-muted d-block">Danh mục</small><strong th:text="${product.category.name}"></strong></div>
                    <div class="col-sm-4"><small class="text-muted d-block">Giá bán</small><strong class="text-primary" th:text="${#numbers.formatDecimal(product.price,0,'COMMA',0,'POINT') + ' ₫'}"></strong></div>
                    <div class="col-sm-4"><small class="text-muted d-block">Tồn kho</small><strong th:text="${product.stock}"></strong></div>
                    <div class="col-sm-4"><small class="text-muted d-block">Đã bán</small><strong th:text="${product.soldCount}"></strong></div>
                    <div class="col-12"><small class="text-muted d-block">Trạng thái</small><span class="badge text-bg-light border" th:text="${product.status.label}"></span></div>
                    <div class="col-12"><small class="text-muted d-block">Mô tả</small><p class="preserve-lines mb-0" th:text="${product.description}"></p></div>
                </div>
            </section>
            <section class="card p-4">
                <h2 class="h5">Tùy chọn bán hàng</h2>
                <div class="mb-3"><small class="text-muted d-block mb-2">Size đang áp dụng</small><span class="badge text-bg-light border me-2" th:each="size : ${sizes}" th:text="${size.code + ' +' + #numbers.formatDecimal(size.extraPrice,0,'COMMA',0,'POINT') + ' ₫'}"></span><span class="text-muted" th:if="${#lists.isEmpty(sizes)}">Không áp dụng size</span></div>
                <div><small class="text-muted d-block mb-2">Topping được chọn</small><span class="badge text-bg-light border me-2 mb-2" th:each="item : ${productToppings}" th:text="${item.topping.name + ' +' + #numbers.formatDecimal(item.topping.price,0,'COMMA',0,'POINT') + ' ₫'}"></span><span class="text-muted" th:if="${#lists.isEmpty(productToppings)}">Không có topping đi kèm</span></div>
            </section>
        </div>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
