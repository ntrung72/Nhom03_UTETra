<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Nhà vận chuyển')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main class="container py-4">
    <div th:replace="~{fragments/management-nav :: nav}"></div>
    <div th:replace="~{fragments/layout :: flash}"></div>
    <div class="d-flex justify-content-between align-items-center">
        <h1 class="h3">Nhà vận chuyển</h1>
        <a class="btn btn-primary" th:href="@{/management/carriers/new}">Thêm nhà vận chuyển</a>
    </div>
    <form class="my-3" method="get">
        <div class="input-group">
            <input class="form-control" name="q" th:value="${q}" placeholder="Tìm tên nhà vận chuyển">
            <button class="btn btn-outline-primary">Tìm kiếm</button>
        </div>
    </form>
    <div class="card table-responsive">
        <table class="table align-middle mb-0">
            <thead><tr><th>Tên nhà vận chuyển</th><th>Phí vận chuyển</th><th>Trạng thái</th><th></th></tr></thead>
            <tbody>
            <tr th:each="c : ${carriers.content}">
                <td th:text="${c.name}"></td>
                <td th:text="${#numbers.formatDecimal(c.shippingFee,0,'COMMA',0,'POINT')} + ' ₫'"></td>
                <td th:text="${c.active ? 'Hoạt động' : 'Đã tắt'}"></td>
                <td class="text-nowrap">
                    <a class="btn btn-sm btn-outline-primary" th:href="@{/management/carriers/{id}/edit(id=${c.id})}">Sửa</a>
                    <form class="d-inline" th:action="@{/management/carriers/{id}/toggle(id=${c.id})}" method="post"><button class="btn btn-sm btn-outline-warning">Bật/tắt</button></form>
                    <form class="d-inline" th:action="@{/management/carriers/{id}/delete(id=${c.id})}" method="post" onsubmit="return confirm('Xóa nhà vận chuyển này?')"><button class="btn btn-sm btn-outline-danger">Xóa</button></form>
                </td>
            </tr>
            <tr th:if="${carriers.empty}"><td colspan="4" class="text-center text-muted py-4">Không tìm thấy nhà vận chuyển.</td></tr>
            </tbody>
        </table>
    </div>
    <nav class="mt-3" th:if="${carriers.totalPages > 1}">
        <ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${carriers.first} ? 'disabled'"><a class="page-link" th:href="@{/management/carriers(page=${carriers.number - 1},q=${q})}">Trước</a></li>
            <li class="page-item" th:each="i : ${#numbers.sequence(0, carriers.totalPages - 1)}" th:classappend="${i == carriers.number} ? 'active'"><a class="page-link" th:href="@{/management/carriers(page=${i},q=${q})}" th:text="${i + 1}"></a></li>
            <li class="page-item" th:classappend="${carriers.last} ? 'disabled'"><a class="page-link" th:href="@{/management/carriers(page=${carriers.number + 1},q=${q})}">Sau</a></li>
        </ul>
    </nav>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
