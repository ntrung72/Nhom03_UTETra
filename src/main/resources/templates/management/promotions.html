<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Khuyến mãi hệ thống')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main class="container py-4 management-page">
    <div class="admin-dashboard-shell">
        <div th:replace="~{fragments/management-nav :: nav}"></div>
        <div class="admin-dashboard-content">
    <div th:replace="~{fragments/layout :: flash}"></div>
    <div class="d-flex justify-content-between align-items-center">
        <h1 class="h3">Quản lý chương trình khuyến mãi</h1>
        <a class="btn btn-primary" th:href="@{/management/promotions/new}">Tạo chương trình</a>
    </div>
    <form class="row g-2 my-3" method="get">
        <div class="col-md"><input class="form-control" name="q" th:value="${q}" placeholder="Tên chương trình"></div>
        <div class="col-md"><select class="form-select" name="shop"><option value="" th:text="${currentUser.role.name() == 'ADMIN' ? 'Mọi shop / toàn hệ thống' : 'Mọi shop được phân công'}">Mọi shop / toàn hệ thống</option><option th:each="s : ${shops}" th:value="${s.id}" th:text="${s.name}" th:selected="${s.id == selectedShop}"></option></select></div>
        <div class="col-md"><select class="form-select" name="type"><option value="">Mọi loại</option><option th:each="t : ${types}" th:value="${t}" th:text="${t.label}" th:selected="${t == selectedType}"></option></select></div>
        <div class="col-auto"><button class="btn btn-primary">Lọc</button></div>
    </form>
    <div class="card table-responsive">
        <table class="table align-middle mb-0">
            <thead><tr><th>Chương trình</th><th>Phạm vi</th><th>Loại / Giá trị</th><th>Thời gian</th><th>Trạng thái</th><th></th></tr></thead>
            <tbody>
            <tr th:each="p : ${promotions.content}">
                <td><strong th:text="${p.name}"></strong></td>
                <td><span th:text="${p.shop?.name ?: 'Toàn hệ thống'}"></span><div class="text-muted" th:text="${p.product == null ? 'Tất cả sản phẩm phù hợp' : p.product.name}"></div></td>
                <td><span th:text="${p.type.label}"></span><div th:text="${p.discountValue + (p.type == T(vn.iotstar.entity.DomainEnums.PromotionType).PRODUCT_PERCENT ? '%' : ' ₫')}"></div></td>
                <td th:text="${#temporals.format(p.startsAt,'dd/MM/yyyy HH:mm') + ' — ' + #temporals.format(p.endsAt,'dd/MM/yyyy HH:mm')}"></td>
                <td th:text="${p.active ? 'Đang bật' : 'Đã tắt'}"></td>
                <td class="text-nowrap">
                    <a class="btn btn-sm btn-outline-primary" th:href="@{/management/promotions/{id}/edit(id=${p.id})}">Sửa</a>
                    <form class="d-inline confirm-form" data-confirm="Xóa chương trình khuyến mãi này?" th:action="@{/management/promotions/{id}/delete(id=${p.id})}" method="post"><button class="btn btn-sm btn-outline-danger">Xóa</button></form>
                </td>
            </tr>
            <tr th:if="${promotions.empty}"><td colspan="6" class="text-center text-muted py-4">Không tìm thấy chương trình khuyến mãi.</td></tr>
            </tbody>
        </table>
    </div>
    <nav class="mt-3" th:if="${promotions.totalPages > 1}">
        <ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${promotions.first} ? 'disabled'"><a class="page-link" th:href="@{/management/promotions(page=${promotions.number - 1},q=${q},shop=${selectedShop},type=${selectedType})}">Trước</a></li>
            <li class="page-item" th:each="i : ${#numbers.sequence(0, promotions.totalPages - 1)}" th:classappend="${i == promotions.number} ? 'active'"><a class="page-link" th:href="@{/management/promotions(page=${i},q=${q},shop=${selectedShop},type=${selectedType})}" th:text="${i + 1}"></a></li>
            <li class="page-item" th:classappend="${promotions.last} ? 'disabled'"><a class="page-link" th:href="@{/management/promotions(page=${promotions.number + 1},q=${q},shop=${selectedShop},type=${selectedType})}">Sau</a></li>
        </ul>
    </nav>
        </div>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
