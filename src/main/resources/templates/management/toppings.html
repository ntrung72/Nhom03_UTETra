<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Quản lý topping')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main class="container py-4">
    <div th:replace="~{fragments/management-nav :: nav}"></div>
    <div th:replace="~{fragments/layout :: flash}"></div>

    <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 mb-3">
        <div>
            <span class="page-kicker"><i class="bi bi-plus-circle"></i> Danh mục tùy chọn</span>
            <h1 class="h3 mb-1">Quản lý topping</h1>
            <p class="text-muted mb-0">Quản lý giá và trạng thái topping để Vendor lựa chọn cho từng sản phẩm.</p>
        </div>
        <a class="btn btn-primary" th:href="@{/management/toppings/new}"><i class="bi bi-plus-lg me-1"></i>Thêm topping</a>
    </div>

    <form class="card p-3 mb-3" method="get">
        <div class="input-group">
            <span class="input-group-text bg-white"><i class="bi bi-search"></i></span>
            <input class="form-control" name="q" th:value="${q}" placeholder="Tìm theo tên topping">
            <button class="btn btn-outline-primary">Tìm kiếm</button>
        </div>
    </form>

    <div class="card table-responsive">
        <table class="table align-middle mb-0">
            <thead><tr><th>Topping</th><th class="text-end">Giá bán</th><th>Trạng thái</th><th class="text-end">Thao tác</th></tr></thead>
            <tbody>
            <tr th:each="t : ${toppings.content}">
                <td><div class="d-flex align-items-center gap-2"><span class="rounded-circle bg-primary-subtle text-primary d-inline-flex align-items-center justify-content-center" style="width:38px;height:38px"><i class="bi bi-cup-straw"></i></span><strong th:text="${t.name}"></strong></div></td>
                <td class="text-end fw-semibold" th:text="${#numbers.formatDecimal(t.price,0,'COMMA',0,'POINT')} + ' ₫'"></td>
                <td><span class="badge" th:classappend="${t.active} ? 'text-bg-success' : 'text-bg-secondary'" th:text="${t.active ? 'Đang hoạt động' : 'Đã tắt'}"></span></td>
                <td class="text-end text-nowrap">
                    <a class="btn btn-sm btn-outline-primary" th:href="@{/management/toppings/{id}/edit(id=${t.id})}"><i class="bi bi-pencil"></i> Sửa</a>
                    <form class="d-inline" th:action="@{/management/toppings/{id}/toggle(id=${t.id})}" method="post"><button class="btn btn-sm btn-outline-warning" th:text="${t.active ? 'Tắt' : 'Bật'}"></button></form>
                    <form class="d-inline confirm-form" th:action="@{/management/toppings/{id}/delete(id=${t.id})}" method="post"><button class="btn btn-sm btn-outline-danger"><i class="bi bi-trash"></i></button></form>
                </td>
            </tr>
            <tr th:if="${toppings.empty}"><td colspan="4" class="text-center text-muted py-5"><i class="bi bi-cup-straw fs-2 d-block mb-2"></i>Không tìm thấy topping.</td></tr>
            </tbody>
        </table>
    </div>

    <nav class="mt-3" th:if="${toppings.totalPages > 1}">
        <ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${toppings.first} ? 'disabled'"><a class="page-link" th:href="@{/management/toppings(page=${toppings.number - 1},q=${q})}">Trước</a></li>
            <li class="page-item" th:each="i : ${#numbers.sequence(0, toppings.totalPages - 1)}" th:classappend="${i == toppings.number} ? 'active'"><a class="page-link" th:href="@{/management/toppings(page=${i},q=${q})}" th:text="${i + 1}"></a></li>
            <li class="page-item" th:classappend="${toppings.last} ? 'disabled'"><a class="page-link" th:href="@{/management/toppings(page=${toppings.number + 1},q=${q})}">Sau</a></li>
        </ul>
    </nav>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
