<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Cửa hàng')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main class="container py-4">
    <div th:replace="~{fragments/management-nav :: nav}"></div>
    <div th:replace="~{fragments/layout :: flash}"></div>
    <h1 class="h3">Quản lý cửa hàng & chiết khấu ứng dụng</h1>
    <div class="alert alert-info border-0"><i class="bi bi-info-circle me-1"></i>Tỷ lệ hoa hồng được lưu trên hồ sơ Shop; chức năng snapshot Order sẽ do bước Checkout triển khai sau.</div>
    <form class="row g-2 mb-3" method="get">
        <div class="col-md"><input class="form-control" name="q" th:value="${q}" placeholder="Tên shop, chủ shop hoặc email"></div>
        <div class="col-md">
            <select class="form-select" name="status">
                <option value="">Mọi trạng thái</option>
                <option th:each="s : ${statuses}" th:value="${s}" th:text="${s.name()}" th:selected="${s == selectedStatus}"></option>
            </select>
        </div>
        <div class="col-auto"><button class="btn btn-primary">Lọc</button></div>
    </form>
    <div class="card table-responsive">
        <table class="table align-middle mb-0">
            <thead><tr><th>Cửa hàng</th><th>Chủ shop</th><th>Hiện tại</th><th>Trạng thái & chiết khấu</th></tr></thead>
            <tbody>
            <tr th:each="s : ${shops.content}">
                <td><strong th:text="${s.name}"></strong><div class="text-muted" th:text="${s.slug}"></div></td>
                <td><span th:text="${s.owner.fullName}"></span><div class="text-muted" th:text="${s.owner.username + ' · ' + s.owner.email}"></div></td>
                <td><span class="badge text-bg-info" th:text="${s.status.name()}"></span><div class="mt-1" th:text="${s.commissionRate + '% chiết khấu'}"></div></td>
                <td>
                    <form class="d-flex gap-2" th:action="@{/management/shops/{id}(id=${s.id})}" method="post">
                        <select class="form-select" name="status">
                            <option th:each="x : ${statuses}" th:value="${x}" th:text="${x.name()}" th:selected="${x == s.status}"></option>
                        </select>
                        <div class="input-group">
                            <input class="form-control" type="number" name="commissionRate" min="0" max="100" step="0.01" th:value="${s.commissionRate}" aria-label="Chiết khấu ứng dụng">
                            <span class="input-group-text">%</span>
                        </div>
                        <button class="btn btn-primary">Lưu</button>
                    </form>
                </td>

            </tr>
            <tr th:if="${shops.empty}"><td colspan="4" class="text-center text-muted py-4">Không tìm thấy cửa hàng.</td></tr>
            </tbody>
        </table>
    </div>
    <nav class="mt-3" th:if="${shops.totalPages > 1}">
        <ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${shops.first} ? 'disabled'"><a class="page-link" th:href="@{/management/shops(page=${shops.number - 1},q=${q},status=${selectedStatus})}">Trước</a></li>
            <li class="page-item" th:each="i : ${#numbers.sequence(0, shops.totalPages - 1)}" th:classappend="${i == shops.number} ? 'active'"><a class="page-link" th:href="@{/management/shops(page=${i},q=${q},status=${selectedStatus})}" th:text="${i + 1}"></a></li>
            <li class="page-item" th:classappend="${shops.last} ? 'disabled'"><a class="page-link" th:href="@{/management/shops(page=${shops.number + 1},q=${q},status=${selectedStatus})}">Sau</a></li>
        </ul>
    </nav>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
