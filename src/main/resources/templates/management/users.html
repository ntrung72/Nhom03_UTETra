<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Người dùng')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main class="container py-4 management-page">
    <div class="admin-dashboard-shell">
        <div th:replace="~{fragments/management-nav :: nav}"></div>
        <div class="admin-dashboard-content">
    <div th:replace="~{fragments/layout :: flash}"></div>
    <h1 class="h3">Quản lý người dùng</h1>
    <form class="mb-3" method="get">
        <div class="input-group">
            <input class="form-control" name="q" th:value="${q}" placeholder="Tên, tài khoản hoặc email">
            <button class="btn btn-primary">Tìm kiếm</button>
        </div>
    </form>
    <div class="card table-responsive">
        <table class="table align-middle mb-0">
            <thead><tr><th>Tài khoản</th><th>Email</th><th>Vai trò</th><th>Trạng thái</th><th>Thao tác</th></tr></thead>
            <tbody>
            <tr th:each="u : ${users.content}">
                <td><strong th:text="${u.username}"></strong><div th:text="${u.fullName}"></div></td>
                <td th:text="${u.email}"></td>
                <td>
                    <form class="d-flex gap-1" th:if="${currentUser.role == T(vn.iotstar.entity.DomainEnums.Role).ADMIN and u.id != currentUser.id}"
                          th:action="@{/management/users/{id}/role(id=${u.id})}" method="post">
                        <select class="form-select form-select-sm" name="role">
                            <option th:each="r : ${roles}" th:value="${r}" th:text="${r.label}" th:selected="${r == u.role}"></option>
                        </select>
                        <button class="btn btn-sm btn-primary">Lưu</button>
                    </form>
                    <span th:unless="${currentUser.role == T(vn.iotstar.entity.DomainEnums.Role).ADMIN and u.id != currentUser.id}"
                          th:text="${u.role.label}"></span>
                </td>
                <td th:text="${u.locked ? 'Đã khóa' : (u.enabled ? 'Hoạt động' : 'Chưa kích hoạt')}"></td>
                <td th:with="protectedAccount=${currentUser.role == T(vn.iotstar.entity.DomainEnums.Role).MANAGER and (u.role == T(vn.iotstar.entity.DomainEnums.Role).ADMIN or u.role == T(vn.iotstar.entity.DomainEnums.Role).MANAGER)}">
                    <form th:if="${u.id != currentUser.id and !protectedAccount}"
                          th:action="@{/management/users/{id}/toggle-lock(id=${u.id})}" method="post">
                        <button class="btn btn-sm btn-outline-warning" th:text="${u.locked ? 'Mở khóa' : 'Khóa'}"></button>
                    </form>
                    <span class="text-muted" th:if="${u.id == currentUser.id or protectedAccount}">Không thể thao tác</span>
                </td>
            </tr>
            <tr th:if="${users.empty}"><td colspan="5" class="text-center text-muted py-4">Không tìm thấy người dùng.</td></tr>
            </tbody>
        </table>
    </div>
    <nav class="mt-3" th:if="${users.totalPages > 1}">
        <ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${users.first} ? 'disabled'"><a class="page-link" th:href="@{/management/users(page=${users.number - 1},q=${q})}">Trước</a></li>
            <li class="page-item" th:each="i : ${#numbers.sequence(0, users.totalPages - 1)}" th:classappend="${i == users.number} ? 'active'"><a class="page-link" th:href="@{/management/users(page=${i},q=${q})}" th:text="${i + 1}"></a></li>
            <li class="page-item" th:classappend="${users.last} ? 'disabled'"><a class="page-link" th:href="@{/management/users(page=${users.number + 1},q=${q})}">Sau</a></li>
        </ul>
    </nav>
        </div>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
