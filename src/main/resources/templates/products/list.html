<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Sản phẩm')}"></head>

<body>

<header th:replace="~{fragments/layout :: header}"></header>

<div th:replace="~{fragments/layout :: flash}"></div>

<main class="container py-4">

    <div class="d-flex justify-content-between
                align-items-center mb-3">

        <div>

            <h1 class="section-title mb-1">
                Khám phá sản phẩm
            </h1>

            <p class="text-muted mb-0">
                20 sản phẩm mỗi trang · mới, bán chạy,
                đánh giá và yêu thích.
            </p>

        </div>

    </div>

    <form class="panel mb-4"
          method="get"
          th:action="@{/products}">

        <div class="row g-3 align-items-end">

            <div class="col-lg-4">

                <label class="form-label" for="q">
                    Từ khóa
                </label>

                <input class="form-control"
                       id="q" name="q"
                       th:value="${q}"
                       placeholder="Tên sản phẩm...">

            </div>

            <div class="col-md-3">

                <label class="form-label" for="category">
                    Danh mục
                </label>

                <select class="form-select"
                        id="category" name="category">

                    <option value="">
                        Tất cả danh mục
                    </option>

                    <option th:each="category : ${navCategories}"
                            th:value="${category.id}"
                            th:text="${category.name}"
                            th:selected="${category.id
                                == selectedCategory}">
                    </option>

                </select>

            </div>

            <div class="col-md-3">

                <label class="form-label" for="shop">
                    Cửa hàng
                </label>

                <select class="form-select"
                        id="shop" name="shop">

                    <option value="">
                        Tất cả cửa hàng
                    </option>

                    <option th:each="shop : ${shops}"
                            th:value="${shop.id}"
                            th:text="${shop.name}"
                            th:selected="${shop.id
                                == selectedShop}">
                    </option>

                </select>

            </div>

            <div class="col-md-2">

                <label class="form-label" for="sort">
                    Sắp xếp
                </label>

                <select class="form-select"
                        id="sort" name="sort">

                    <option value="bestselling"
                            th:selected="${sort == 'bestselling'}">
                        Bán chạy
                    </option>

                    <option value="newest"
                            th:selected="${sort == 'newest'}">
                        Mới nhất
                    </option>

                    <option value="rating"
                            th:selected="${sort == 'rating'}">
                        Đánh giá
                    </option>

                    <option value="favorite"
                            th:selected="${sort == 'favorite'}">
                        Yêu thích
                    </option>

                    <option value="price-asc"
                            th:selected="${sort == 'price-asc'}">
                        Giá tăng
                    </option>

                    <option value="price-desc"
                            th:selected="${sort == 'price-desc'}">
                        Giá giảm
                    </option>

                </select>

            </div>

            <div class="col-sm-6 col-lg-3">

                <label class="form-label" for="minPrice">
                    Giá từ
                </label>

                <div class="input-group">
                    <input class="form-control"
                           id="minPrice" name="minPrice"
                           type="number"
                           min="0"
                           step="1000"
                           th:value="${minPrice}"
                           placeholder="0">
                    <span class="input-group-text">đ</span>
                </div>

            </div>

            <div class="col-sm-6 col-lg-3">

                <label class="form-label" for="maxPrice">
                    Giá đến
                </label>

                <div class="input-group">
                    <input class="form-control"
                           id="maxPrice" name="maxPrice"
                           type="number"
                           min="0"
                           step="1000"
                           th:value="${maxPrice}"
                           placeholder="Không giới hạn">
                    <span class="input-group-text">đ</span>
                </div>

            </div>

            <div class="col-sm-6 col-lg-3">

                <label class="form-label" for="minRating">
                    Đánh giá tối thiểu
                </label>

                <select class="form-select" id="minRating" name="minRating">
                    <option value="">Tất cả đánh giá</option>
                    <option value="4.5" th:selected="${minRating != null and minRating.doubleValue() == 4.5}">4,5 ★ trở lên</option>
                    <option value="4" th:selected="${minRating != null and minRating.doubleValue() == 4}">4 ★ trở lên</option>
                    <option value="3" th:selected="${minRating != null and minRating.doubleValue() == 3}">3 ★ trở lên</option>
                </select>

            </div>

            <div class="col-sm-6 col-lg-3">
                <div class="d-flex flex-column gap-2 pb-1">
                    <div class="form-check form-switch">
                        <input class="form-check-input" id="discounted" name="discounted"
                               type="checkbox" value="true" th:checked="${discounted}">
                        <label class="form-check-label" for="discounted">Đang giảm giá</label>
                    </div>
                    <div class="form-check form-switch">
                        <input class="form-check-input" id="inStock" name="inStock"
                               type="checkbox" value="true" th:checked="${inStock}">
                        <label class="form-check-label" for="inStock">Chỉ sản phẩm còn hàng</label>
                    </div>
                </div>
            </div>

            <div class="col-12 d-flex flex-wrap align-items-center gap-2">

                <button class="btn btn-primary"
                        type="submit">

                    <i class="bi bi-funnel"></i>
                    Tìm và lọc

                </button>

                <a class="btn btn-light"
                   th:href="@{/products}">
                    Đặt lại
                </a>

                <span class="text-muted small ms-sm-auto"
                      th:text="|Tìm thấy ${products.totalElements} sản phẩm|">
                    Tìm thấy 0 sản phẩm
                </span>

            </div>

        </div>

    </form>

    <div class="row row-cols-2 row-cols-md-3
                row-cols-xl-4 g-4"
         th:if="${products.hasContent()}">

        <th:block th:each="product : ${products.content}">

            <div th:replace="~{fragments/product-card
                 :: card(${product})}">
            </div>

        </th:block>

    </div>

    <div class="panel empty-state"
         th:unless="${products.hasContent()}">

        <i class="bi bi-search fs-1"></i>

        <h5>
            Không tìm thấy sản phẩm phù hợp
        </h5>

    </div>

    <nav aria-label="Phân trang sản phẩm" class="d-flex justify-content-center
                gap-2 mt-4"
         th:if="${products.totalPages > 1}">

        <a class="btn btn-outline-primary"
           th:classappend="${products.first} ? 'disabled'"
           th:href="@{/products(
                q=${q},
                category=${selectedCategory},
                shop=${selectedShop},
                minPrice=${minPrice},
                maxPrice=${maxPrice},
                minRating=${minRating},
                discounted=${discounted},
                inStock=${inStock},
                sort=${sort},
                page=${products.number - 1}
           )}">
            Trước
        </a>

        <span class="btn btn-light"
              th:text="|Trang ${products.number + 1}/${products.totalPages}|">
            Trang 1/1
        </span>

        <a class="btn btn-outline-primary"
           th:classappend="${products.last} ? 'disabled'"
           th:href="@{/products(
                q=${q},
                category=${selectedCategory},
                shop=${selectedShop},
                minPrice=${minPrice},
                maxPrice=${maxPrice},
                minRating=${minRating},
                discounted=${discounted},
                inStock=${inStock},
                sort=${sort},
                page=${products.number + 1}
           )}">
            Sau
        </a>

    </nav>

</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>

</body>
</html>
