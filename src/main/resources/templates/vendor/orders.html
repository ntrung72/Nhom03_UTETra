<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Đơn hàng shop')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main class="container py-4">
    <div class="admin-dashboard-shell">
    <div th:replace="~{fragments/vendor-nav :: nav}"></div>
    <div class="admin-dashboard-content">
    <div th:replace="~{fragments/layout :: flash}"></div>
    <h1 class="h3">Quản lý đơn hàng</h1>

    <form class="d-flex flex-wrap gap-2 my-3" method="get" th:action="@{/vendor/orders}">
        <input class="form-control" style="max-width: 320px" type="search" name="q" th:value="${q}"
               placeholder="Tìm mã đơn hoặc tên người nhận" aria-label="Tìm đơn hàng">
        <input type="hidden" name="status" th:if="${selectedStatus != null}" th:value="${selectedStatus}">
        <input type="hidden" name="pending" th:if="${pending}" value="true">
        <button class="btn btn-primary" type="submit"><i class="bi bi-search me-1"></i>Tìm kiếm</button>
    </form>

    <div class="d-flex flex-wrap gap-2 my-3">
        <a class="btn btn-sm" th:classappend="${selectedStatus == null and !pending} ? 'btn-primary' : 'btn-outline-primary'"
           th:href="@{/vendor/orders(q=${q})}">Tất cả</a>
        <a class="btn btn-sm" th:classappend="${pending} ? 'btn-primary' : 'btn-outline-primary'"
           th:href="@{/vendor/orders(pending=true,q=${q})}">Cần xử lý</a>
        <a class="btn btn-sm" th:each="s : ${statuses}"
           th:classappend="${selectedStatus == s and !pending} ? 'btn-primary' : 'btn-outline-primary'"
           th:href="@{/vendor/orders(status=${s},q=${q})}" th:text="${s.label}"></a>
    </div>

    <div class="card table-responsive">
        <table class="table vendor-orders-table align-middle mb-0">
            <colgroup>
                <col class="vendor-order-col-code"><col class="vendor-order-col-customer"><col class="vendor-order-col-finance">
                <col class="vendor-order-col-shipper"><col class="vendor-order-col-status"><col class="vendor-order-col-update">
            </colgroup>
            <thead><tr><th>Mã</th><th>Khách</th><th>Tài chính</th><th>Shipper</th><th>Trạng thái</th><th>Cập nhật</th></tr></thead>
            <tbody>
            <tr th:each="o : ${orders.content}">
                <td class="vendor-order-summary">
                    <a class="fw-bold text-break" th:href="@{/vendor/orders/{id}(id=${o.id})}" th:text="${o.code}"></a>
                    <div class="small text-muted mt-1" th:if="${!#lists.isEmpty(itemsByOrder[o.id])}">
                        <span th:each="item, itemStat : ${itemsByOrder[o.id]}">
                            <span th:text="${item.productName + ' ×' + item.quantity}"></span><span th:if="${!itemStat.last}">, </span>
                        </span>
                    </div>
                    <a class="small d-inline-block mt-1" th:href="@{/vendor/orders/{id}(id=${o.id})}">Xem món và tùy chọn</a>
                </td>
                <td th:text="${o.receiverName}"></td>
                <td class="vendor-order-finance">
                    <strong th:text="${#numbers.formatDecimal(o.sellerRevenue,0,'COMMA',0,'POINT')} + ' ₫ thực nhận'"></strong>
                    <div class="vendor-order-finance-line text-muted small">
                        <span th:text="${'Hàng sau giảm ' + #numbers.formatDecimal(o.commissionBase,0,'COMMA',0,'POINT') + ' ₫'}"></span>
                        <span th:text="${'Ship ' + #numbers.formatDecimal(o.finalShippingFee,0,'COMMA',0,'POINT') + ' ₫'}"></span>
                    </div>
                    <div class="vendor-order-finance-line text-muted small">
                        <span th:text="${'Khách trả ' + #numbers.formatDecimal(o.totalAmount,0,'COMMA',0,'POINT') + ' ₫'}"></span>
                        <span th:text="${'Phí app ' + #numbers.formatDecimal(o.commissionAmount,0,'COMMA',0,'POINT') + ' ₫ (' + o.commissionRate + '% tiền hàng)'}"></span>
                    </div>
                </td>
                <td th:text="${o.shipper?.fullName ?: 'Chưa phân công'}"></td>
                <td><span class="badge" th:classappend="${o.status.name() == 'DELIVERED'} ? ' text-bg-success' : (${o.status.name() == 'CANCELLED' or o.status.name() == 'DELIVERY_FAILED'} ? ' text-bg-danger' : ' text-bg-primary')" th:text="${o.displayStatusLabel}"></span></td>
                <td>
                    <a class="btn btn-sm btn-warning mb-1" th:if="${returnRequests[o.id] != null}"
                       th:href="@{/vendor/returns/{id}(id=${returnRequests[o.id].id})}"><i class="bi bi-arrow-counterclockwise"></i> Hoàn trả</a>
                    <form class="vendor-order-status-form" th:if="${!#lists.isEmpty(allowedTransitions[o.id])}"
                          th:action="@{/vendor/orders/{id}/status(id=${o.id})}" method="post">
                        <select class="form-select form-select-sm" name="status" required>
                            <option value="">Chọn trạng thái</option>
                            <option th:each="s : ${allowedTransitions[o.id]}" th:value="${s}" th:text="${s.label}"></option>
                        </select>
                        <button class="btn btn-sm btn-primary">Lưu</button>
                    </form>
                    <span class="text-muted" th:if="${#lists.isEmpty(allowedTransitions[o.id]) and returnRequests[o.id] == null}">Không có thao tác</span>
                </td>
            </tr>
            <tr th:if="${orders.empty}"><td colspan="6" class="text-center text-muted py-4">Chưa có đơn hàng ở trạng thái này.</td></tr>
            </tbody>
        </table>
    </div>

    <nav class="mt-3" th:if="${orders.totalPages > 1}" aria-label="Phân trang đơn hàng">
        <ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${orders.first} ? 'disabled'">
                <a class="page-link" th:href="@{/vendor/orders(page=${orders.number - 1},status=${selectedStatus},pending=${pending},q=${q})}">Trước</a>
            </li>
            <li class="page-item" th:each="i : ${#numbers.sequence(0, orders.totalPages - 1)}"
                th:classappend="${i == orders.number} ? 'active'">
                <a class="page-link" th:href="@{/vendor/orders(page=${i},status=${selectedStatus},pending=${pending},q=${q})}" th:text="${i + 1}"></a>
            </li>
            <li class="page-item" th:classappend="${orders.last} ? 'disabled'">
                <a class="page-link" th:href="@{/vendor/orders(page=${orders.number + 1},status=${selectedStatus},pending=${pending},q=${q})}">Sau</a>
            </li>
        </ul>
    </nav>
    </div>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
