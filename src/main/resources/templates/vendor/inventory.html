<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Lịch sử kho')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main class="container py-4">
    <div class="admin-dashboard-shell">
    <div th:replace="~{fragments/vendor-nav :: nav}"></div>
    <div class="admin-dashboard-content">
    <div th:replace="~{fragments/layout :: flash}"></div>
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
        <div><h1 class="h3 mb-1">Lịch sử nhập xuất kho</h1><p class="text-muted mb-0">Theo dõi từng thay đổi số lượng, đơn hàng và người thực hiện.</p></div>
        <a class="btn btn-outline-primary" th:href="@{/vendor/products}">Sản phẩm của tôi</a>
    </div>
    <form class="card p-3 mb-3" method="get" th:action="@{/vendor/inventory}">
        <div class="row g-2 align-items-end">
            <div class="col-md-9"><label class="form-label" for="productId">Lọc theo sản phẩm</label><select class="form-select" id="productId" name="productId"><option value="">Tất cả sản phẩm</option><option th:each="product : ${products}" th:value="${product.id}" th:selected="${product.id == selectedProductId}" th:text="${product.name + ' (' + product.sku + ')'}"></option></select></div>
            <div class="col-md-3"><button class="btn btn-primary w-100">Xem lịch sử</button></div>
        </div>
    </form>
    <div class="table-responsive card">
        <table class="table align-middle mb-0">
            <thead><tr><th>Thời gian</th><th>Sản phẩm</th><th>Nghiệp vụ</th><th class="text-end">Thay đổi</th><th class="text-end">Tồn trước → sau</th><th>Người thực hiện</th><th>Ghi chú / đơn</th></tr></thead>
            <tbody>
            <tr th:each="entry : ${transactions.content}">
                <td class="text-nowrap" th:text="${#temporals.format(entry.createdAt, 'dd/MM/yyyy HH:mm')}"></td>
                <td><b th:text="${entry.productName}"></b><small class="d-block text-muted" th:text="${entry.productSku}"></small></td>
                <td th:text="${entry.type.label}"></td>
                <td class="text-end fw-bold" th:classappend="${entry.quantityChange > 0} ? 'text-success' : 'text-danger'" th:text="${entry.quantityChange > 0 ? '+' + entry.quantityChange : entry.quantityChange}"></td>
                <td class="text-end text-nowrap" th:text="|${entry.stockBefore} → ${entry.stockAfter}|"></td>
                <td th:text="${entry.actor.fullName}"></td>
                <td><span th:if="${entry.order != null}" class="badge text-bg-light me-1" th:text="${entry.order.code}"></span><span th:text="${entry.note}"></span></td>
            </tr>
            <tr th:if="${transactions.empty}"><td colspan="7" class="text-center text-muted py-4">Chưa có biến động kho phù hợp.</td></tr>
            </tbody>
        </table>
    </div>
    <nav class="mt-3" th:if="${transactions.totalPages > 1}" aria-label="Phân trang lịch sử kho"><ul class="pagination justify-content-center">
        <li class="page-item" th:classappend="${transactions.first} ? 'disabled'"><a class="page-link" th:href="@{/vendor/inventory(page=${transactions.number - 1},productId=${selectedProductId})}">Trước</a></li>
        <li class="page-item" th:each="i : ${#numbers.sequence(0, transactions.totalPages - 1)}" th:classappend="${i == transactions.number} ? 'active'"><a class="page-link" th:href="@{/vendor/inventory(page=${i},productId=${selectedProductId})}" th:text="${i + 1}"></a></li>
        <li class="page-item" th:classappend="${transactions.last} ? 'disabled'"><a class="page-link" th:href="@{/vendor/inventory(page=${transactions.number + 1},productId=${selectedProductId})}">Sau</a></li>
    </ul></nav>
    </div>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
