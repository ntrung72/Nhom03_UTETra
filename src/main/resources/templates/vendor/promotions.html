<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Khuyến mãi shop')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main class="container py-4">
    <div class="admin-dashboard-shell">
    <div th:replace="~{fragments/vendor-nav :: nav}"></div>
    <div class="admin-dashboard-content">
    <div th:replace="~{fragments/layout :: flash}"></div>
    <div class="d-flex justify-content-between align-items-center">
        <h1 class="h3">Khuyến mãi</h1>
        <a class="btn btn-primary" th:href="@{/vendor/promotions/new}">Tạo chương trình</a>
    </div>
    <div class="card table-responsive mt-3">
        <table class="table align-middle mb-0">
            <thead><tr><th>Chương trình</th><th>Thời gian</th><th>Trạng thái</th><th></th></tr></thead>
            <tbody>
            <tr th:each="p : ${promotions}">
                <td><strong th:text="${p.name}"></strong><div th:text="${p.type.label + ' · ' + p.discountValue}"></div></td>
                <td th:text="${#temporals.format(p.startsAt,'dd/MM/yyyy HH:mm') + ' — ' + #temporals.format(p.endsAt,'dd/MM/yyyy HH:mm')}"></td>
                <td th:text="${p.active ? 'Đang bật' : 'Đã tắt'}"></td>
                <td class="text-nowrap">
                    <a class="btn btn-sm btn-outline-primary" th:href="@{/vendor/promotions/{id}/edit(id=${p.id})}">Sửa</a>
                    <form class="d-inline confirm-form" data-confirm="Xóa chương trình khuyến mãi này?" th:action="@{/vendor/promotions/{id}/delete(id=${p.id})}" method="post"><button class="btn btn-sm btn-outline-danger">Xóa</button></form>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(promotions)}"><td colspan="4" class="text-center text-muted py-4">Chưa có chương trình khuyến mãi.</td></tr>
            </tbody>
        </table>
    </div>
    </div>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
