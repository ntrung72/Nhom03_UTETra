<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Khuyến mãi')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main class="container py-4">
    <div class="admin-dashboard-shell">
    <div th:replace="~{fragments/vendor-nav :: nav}"></div>
    <div class="admin-dashboard-content">
    <div th:replace="~{fragments/layout :: flash}"></div>
    <div class="card p-4">
        <h1 class="h3">Chương trình khuyến mãi</h1>
        <form th:action="@{/vendor/promotions/save}" th:object="${promotionForm}" method="post">
            <input type="hidden" name="id" th:value="${promotion?.id}">
            <div class="alert alert-danger" th:if="${#fields.hasGlobalErrors()}" th:each="error : ${#fields.globalErrors()}" th:text="${error}"></div>
            <div class="row g-3">
                <div class="col-md-6"><label>Tên</label><input class="form-control" th:field="*{name}"><div class="text-danger" th:errors="*{name}"></div></div>
                <div class="col-md-3"><label>Loại</label><select class="form-select" th:field="*{type}" id="promotionType"><option th:each="t : ${T(vn.iotstar.entity.DomainEnums.PromotionType).values()}" th:value="${t}" th:text="${t.label}"></option></select></div>
                <div class="col-md-3"><label>Giá trị</label><input class="form-control" type="number" step="0.01" th:field="*{discountValue}"><div class="text-danger" th:errors="*{discountValue}"></div></div>
                <div class="col-md-6"><label>Sản phẩm (có thể bỏ trống)</label><select class="form-select" th:field="*{productId}" id="productSelect"><option value="">Toàn shop</option><option th:each="p : ${products}" th:value="${p.id}" th:text="${p.name}"></option></select><div class="form-text" id="productHelp">Bỏ trống để áp dụng cho toàn shop.</div></div>
                <div class="col-md-3"><label>Bắt đầu</label><input class="form-control" type="datetime-local" th:field="*{startsAt}"></div>
                <div class="col-md-3"><label>Kết thúc</label><input class="form-control" type="datetime-local" th:field="*{endsAt}"></div>
                <div class="form-check ms-2"><input class="form-check-input" type="checkbox" th:field="*{active}"><label class="form-check-label">Hoạt động</label></div>
            </div>
            <button class="btn btn-primary mt-3">Lưu</button>
        </form>
    </div>
    </div>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
<script>
document.addEventListener('DOMContentLoaded', () => {
    const type = document.getElementById('promotionType');
    const product = document.getElementById('productSelect');
    const help = document.getElementById('productHelp');
    const refreshProduct = () => {
        const shipping = type.value === 'SHIPPING_DISCOUNT';
        product.disabled = shipping;
        if (shipping) product.value = '';
        help.textContent = shipping
            ? 'Giảm phí vận chuyển áp dụng cho đơn hàng của shop, không áp dụng riêng một sản phẩm.'
            : 'Bỏ trống để áp dụng cho toàn shop.';
    };
    type.addEventListener('change', refreshProduct);
    refreshProduct();
});
</script>
</body>
</html>
