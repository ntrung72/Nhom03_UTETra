<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Sản phẩm shop')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main class="container py-4">
    <div class="admin-dashboard-shell">
    <div th:replace="~{fragments/vendor-nav :: nav}"></div>
    <div class="admin-dashboard-content">
    <div th:replace="~{fragments/layout :: flash}"></div>
    <div class="d-flex justify-content-between align-items-center">
        <h1 class="h3">Sản phẩm của tôi</h1>
        <a class="btn btn-primary" th:href="@{/vendor/products/new}">Thêm sản phẩm</a>
    </div>
    <form class="my-3" method="get">
        <div class="input-group">
            <input class="form-control" name="q" th:value="${q}" placeholder="Tìm tên hoặc SKU">
            <button class="btn btn-outline-primary">Tìm kiếm</button>
        </div>
    </form>
    <div class="table-responsive card">
        <table class="table align-middle mb-0">
            <thead><tr><th>Sản phẩm</th><th>Danh mục</th><th>Giá</th><th>Kho</th><th>Đã bán</th><th>Trạng thái</th><th></th></tr></thead>
            <tbody>
            <tr th:each="p : ${products.content}">
                <td th:text="${p.name + ' (' + p.sku + ')'}"></td>
                <td th:text="${p.category.name}"></td>
                <td th:text="${#numbers.formatDecimal(p.price,0,'COMMA',0,'POINT')} + ' ₫'"></td>
                <td th:text="${p.stock}"></td>
                <td th:text="${p.soldCount}"></td>
                <td th:text="${p.status.label}"></td>
                <td class="text-nowrap">
                    <a class="btn btn-sm btn-outline-primary" th:href="@{/vendor/products/{id}/edit(id=${p.id})}">Sửa</a>
                    <a class="btn btn-sm btn-outline-secondary" th:href="@{/vendor/inventory(productId=${p.id})}">Lịch sử kho</a>
                    <form class="d-inline" th:action="@{/vendor/products/{id}/toggle(id=${p.id})}" method="post">
                        <button class="btn btn-sm btn-outline-warning" th:text="${p.status.name() == 'HIDDEN' ? 'Bỏ ẩn' : 'Ẩn'}"></button>
                    </form>
                </td>
            </tr>
            <tr th:if="${products.empty}"><td colspan="7" class="text-center text-muted py-4">Không tìm thấy sản phẩm.</td></tr>
            </tbody>
        </table>
    </div>
    <nav class="mt-3" th:if="${products.totalPages > 1}" aria-label="Phân trang sản phẩm">
        <ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${products.first} ? 'disabled'">
                <a class="page-link" th:href="@{/vendor/products(page=${products.number - 1},q=${q})}">Trước</a>
            </li>
            <li class="page-item" th:each="i : ${#numbers.sequence(0, products.totalPages - 1)}"
                th:classappend="${i == products.number} ? 'active'">
                <a class="page-link" th:href="@{/vendor/products(page=${i},q=${q})}" th:text="${i + 1}"></a>
            </li>
            <li class="page-item" th:classappend="${products.last} ? 'disabled'">
                <a class="page-link" th:href="@{/vendor/products(page=${products.number + 1},q=${q})}">Sau</a>
            </li>
        </ul>
    </nav>
    </div>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
