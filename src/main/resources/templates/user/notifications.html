<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Thông báo')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main class="container pt-3 pt-lg-4 pb-4 pb-lg-5">
    <div th:replace="~{fragments/layout :: flash}"></div>
    <div class="mb-4"><h1 class="h3 mb-1">Thông báo của bạn</h1><p class="text-muted mb-0">Theo dõi trạng thái đơn hàng và các hoạt động mới nhất.</p></div>
    <div class="list-group" th:if="${notifications.hasContent()}">
        <article class="list-group-item p-3 p-md-4" th:each="n : ${notifications.content}" th:classappend="${!n.read} ? 'list-group-item-primary'">
            <div class="d-flex gap-3">
                <div class="avatar d-grid place-items-center flex-shrink-0"><i class="bi bi-bell text-primary"></i></div>
                <div class="flex-grow-1">
                    <div class="d-flex flex-column flex-md-row justify-content-between gap-1"><strong th:text="${n.title}"></strong><small class="text-muted text-nowrap" th:text="${#temporals.format(n.createdAt,'dd/MM/yyyy HH:mm')}"></small></div>
                    <p class="mb-2 mt-1" th:text="${n.message}"></p>
                    <div class="d-flex flex-wrap gap-2"><a class="btn btn-sm btn-outline-primary" th:if="${n.link != null}" th:href="${n.link}">Xem chi tiết</a><form th:if="${!n.read}" th:action="@{/notifications/{id}/read(id=${n.id})}" method="post"><button class="btn btn-sm btn-light">Đánh dấu đã đọc</button></form></div>
                </div>
            </div>
        </article>
    </div>
    <div class="panel empty-state" th:unless="${notifications.hasContent()}"><i class="bi bi-bell-slash fs-1"></i><h2 class="h5">Chưa có thông báo</h2><p class="mb-0">Thông tin mới sẽ xuất hiện tại đây.</p></div>
    <nav class="mt-4" th:if="${notifications.totalPages > 1}"><ul class="pagination justify-content-center"><li class="page-item" th:classappend="${notifications.first} ? 'disabled'"><a class="page-link" th:href="@{/notifications(page=${notifications.number - 1})}">Trước</a></li><li class="page-item active"><span class="page-link" th:text="${notifications.number + 1}"></span></li><li class="page-item" th:classappend="${notifications.last} ? 'disabled'"><a class="page-link" th:href="@{/notifications(page=${notifications.number + 1})}">Sau</a></li></ul></nav>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
