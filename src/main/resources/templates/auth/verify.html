<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Xác thực OTP')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main class="container auth-shell">
    <section class="auth-card card">
        <span class="page-kicker"><i class="bi bi-envelope-check"></i> Xác thực email</span>
        <h1 class="h3 mb-2">Kích hoạt tài khoản</h1>
        <p class="text-muted mb-4">Mã 6 số đã gửi tới <strong class="text-dark" th:text="${email}"></strong> và có hiệu lực trong 5 phút.</p>
        <div th:replace="~{fragments/layout :: flash}"></div>
        <form method="post" th:action="@{/verify-account}">
            <input type="hidden" name="email" th:value="${email}">
            <label class="form-label" for="code">Mã xác thực</label>
            <input class="form-control form-control-lg otp-input text-center mb-4" id="code" name="code" inputmode="numeric" autocomplete="one-time-code" minlength="6" maxlength="6" placeholder="000000" required autofocus>
            <button class="btn btn-primary btn-lg w-100"><i class="bi bi-check2-circle"></i>Xác nhận</button>
        </form>
        <form class="mt-2" method="post" th:action="@{/resend-otp}">
            <input type="hidden" name="email" th:value="${email}">
            <button class="btn btn-link w-100" data-otp-resend
                    th:data-otp-cooldown="${otpCooldownSeconds}"
                    th:disabled="${otpCooldownSeconds > 0}">
                <i class="bi bi-arrow-clockwise"></i><span data-otp-label>Gửi lại OTP</span>
            </button>
            <small class="d-block text-center text-muted">Tối đa 5 mã OTP mỗi giờ.</small>
        </form>
    </section>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
