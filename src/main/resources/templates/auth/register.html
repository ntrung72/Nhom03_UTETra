<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Đăng ký')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main class="container auth-shell">
    <section class="auth-card card auth-card-wide">
        <span class="page-kicker"><i class="bi bi-person-plus"></i> Thành viên mới</span>
        <h1 class="h3 mb-2">Tạo tài khoản UTETra</h1>
        <p class="text-muted mb-4">Chỉ mất một phút để bắt đầu đặt món và lưu những lựa chọn yêu thích.</p>
        <div th:replace="~{fragments/layout :: flash}"></div>
        <form th:action="@{/register}" th:object="${form}" method="post">
            <div class="row g-3">
                <div class="col-md-6"><label class="form-label">Tên đăng nhập</label><input class="form-control" th:field="*{username}" autocomplete="username" placeholder="Ví dụ: namtrung"><small class="text-danger" th:errors="*{username}"></small></div>
                <div class="col-md-6"><label class="form-label">Họ và tên</label><input class="form-control" th:field="*{fullName}" autocomplete="name" placeholder="Tên hiển thị"><small class="text-danger" th:errors="*{fullName}"></small></div>
                <div class="col-12"><label class="form-label">Email nhận OTP</label><input class="form-control" type="email" th:field="*{email}" autocomplete="email" placeholder="you@example.com"><small class="text-danger" th:errors="*{email}"></small></div>
                <div class="col-md-6"><label class="form-label">Mật khẩu</label><input class="form-control" type="password" th:field="*{password}" autocomplete="new-password" placeholder="Tối thiểu 8 ký tự"></div>
                <div class="col-md-6"><label class="form-label">Nhập lại mật khẩu</label><input class="form-control" type="password" th:field="*{confirmPassword}" autocomplete="new-password" placeholder="Nhập lại mật khẩu"></div>
            </div>
            <button class="btn btn-primary btn-lg w-100 mt-4"><i class="bi bi-envelope-check"></i>Đăng ký và nhận OTP</button>
        </form>
        <p class="text-center text-muted mt-4 mb-0">Đã có tài khoản? <a class="fw-bold text-decoration-none" th:href="@{/login}">Đăng nhập</a></p>
    </section>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
