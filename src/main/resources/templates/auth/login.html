<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Đăng nhập')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main class="container auth-shell auth-shell-entry">
    <section class="auth-card card">
        <h1 class="h3 mb-2">Đăng nhập UTETra</h1>
        <p class="text-muted mb-4">Tiếp tục mua sắm, theo dõi đơn hàng và quản lý tài khoản của bạn.</p>
        <div th:replace="~{fragments/layout :: flash}"></div>
        <div class="alert alert-danger" th:if="${param.error}">Sai tài khoản, mật khẩu hoặc tài khoản đã bị khóa.</div>
        <div class="alert alert-success" th:if="${param.logout}">Bạn đã đăng xuất.</div>
        <form method="post" th:action="@{/login}">
            <label class="form-label" for="username">Tên đăng nhập hoặc email</label>
            <input class="form-control mb-3" id="username" name="username" autocomplete="username" placeholder="Nhập tài khoản của bạn" required autofocus>
            <div class="d-flex justify-content-between align-items-center">
                <label class="form-label" for="password">Mật khẩu</label>
                <a class="small text-decoration-none" th:href="@{/forgot-password}">Quên mật khẩu?</a>
            </div>
            <div class="password-field mb-3">
                <input class="form-control" id="password" type="password" name="password" autocomplete="current-password" placeholder="Nhập mật khẩu" required>
                <button type="button" class="password-toggle" aria-label="Hiện mật khẩu" aria-controls="password" aria-pressed="false" hidden><i class="bi bi-eye-slash" aria-hidden="true"></i></button>
            </div>
            <div class="form-check mb-4"><input class="form-check-input" type="checkbox" name="remember-me" id="remember"><label class="form-check-label" for="remember">Ghi nhớ đăng nhập</label></div>
            <button class="btn btn-primary btn-lg w-100">Đăng nhập</button>
        </form>
        <p class="text-center text-muted mt-4 mb-0">Chưa có tài khoản? <a class="fw-bold text-decoration-none" th:href="@{/register}">Đăng ký ngay</a></p>
    </section>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
