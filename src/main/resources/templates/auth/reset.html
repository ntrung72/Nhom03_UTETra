<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Đặt lại mật khẩu')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main class="container auth-shell">
    <section class="auth-card card">
        <h1 class="h3 mb-2">Đặt lại mật khẩu</h1>
        <p class="text-muted mb-4">Dùng mã OTP trong email và tạo mật khẩu mới có ít nhất 8 ký tự.</p>
        <div th:replace="~{fragments/layout :: flash}"></div>
        <form method="post" th:action="@{/reset-password}">
            <input type="hidden" name="email" th:value="${email}">
            <label class="form-label" for="code">Mã OTP</label><input class="form-control otp-input text-center mb-3" id="code" name="code" inputmode="numeric" minlength="6" maxlength="6" placeholder="000000" required>
            <label class="form-label" for="password">Mật khẩu mới</label>
            <div class="password-field mb-3"><input class="form-control" id="password" type="password" name="password" autocomplete="new-password" minlength="8" placeholder="Tối thiểu 8 ký tự" required><button type="button" class="password-toggle" aria-label="Hiện mật khẩu" aria-controls="password" aria-pressed="false" hidden><i class="bi bi-eye-slash" aria-hidden="true"></i></button></div>
            <label class="form-label" for="confirmPassword">Nhập lại mật khẩu</label>
            <div class="password-field mb-4"><input class="form-control" id="confirmPassword" type="password" name="confirmPassword" autocomplete="new-password" placeholder="Nhập lại mật khẩu" required><button type="button" class="password-toggle" aria-label="Hiện mật khẩu" aria-controls="confirmPassword" aria-pressed="false" hidden><i class="bi bi-eye-slash" aria-hidden="true"></i></button></div>
            <button class="btn btn-primary btn-lg w-100"><i class="bi bi-check2-circle"></i>Đổi mật khẩu</button>
        </form>
    </section>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
