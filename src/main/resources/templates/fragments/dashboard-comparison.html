<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>
<section class="dashboard-comparison card dashboard-panel mb-4" th:fragment="panel" aria-label="So sánh doanh thu với kỳ trước">
    <div class="dashboard-comparison-copy">
        <span class="section-kicker">SO SÁNH CÙNG SỐ NGÀY</span>
        <h2 class="h5 mb-1">Doanh thu hoàn tất so với kỳ liền trước</h2>
        <p class="text-muted small mb-0">Chỉ tính đơn đã giao và đã thanh toán trong phạm vi cửa hàng đang xem.</p>
    </div>
    <div class="dashboard-comparison-values">
        <span class="dashboard-comparison-metric"><small>Kỳ trước</small><strong th:text="${#numbers.formatDecimal(dashboard.revenueComparison.previous,0,'COMMA',0,'POINT')} + ' ₫'">0 ₫</strong></span>
        <span class="dashboard-comparison-metric"><small>Kỳ này</small><strong th:text="${#numbers.formatDecimal(dashboard.revenueComparison.current,0,'COMMA',0,'POINT')} + ' ₫'">0 ₫</strong></span>
        <span class="dashboard-comparison-trend" th:classappend="|is-${dashboard.revenueComparison.trend()}|">
            <strong th:if="${dashboard.revenueComparison.changePercent != null}"
                    th:text="|${dashboard.revenueComparison.changePercent.signum() > 0 ? '+' : ''}${#numbers.formatDecimal(dashboard.revenueComparison.changePercent,1,1)}%|">+0%</strong>
            <strong th:unless="${dashboard.revenueComparison.changePercent != null}">Chưa có mốc</strong>
            <small th:text="${dashboard.revenueComparison.changePercent != null} ? 'so với kỳ trước' : 'kỳ trước chưa có doanh thu'">so với kỳ trước</small>
        </span>
    </div>
</section>
</body>
</html>
