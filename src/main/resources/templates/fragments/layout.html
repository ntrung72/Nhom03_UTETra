<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(pageTitle)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${pageTitle} + ' | UTETra'">UTETra</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800;900&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header th:fragment="header">
    <nav class="navbar navbar-expand-lg navbar-dark sticky-top" aria-label="Điều hướng chính">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2 fw-bold" th:href="@{/login}">
                <img th:src="@{/images/logo.svg}" alt="UTETra"><span>UTETra</span>
            </a>
            <div class="d-flex align-items-center gap-2" th:if="${currentUser == null}">
                <a class="btn btn-outline-light btn-sm" th:href="@{/login}">Đăng nhập</a>
                <a class="btn btn-warning btn-sm" th:href="@{/register}">Đăng ký</a>
            </div>
            <div class="d-flex align-items-center gap-2 text-white" th:if="${currentUser != null}">
                <span th:text="${currentUser.fullName}">Tài khoản</span>
                <form method="post" th:action="@{/logout}"><button class="btn btn-outline-light btn-sm">Đăng xuất</button></form>
            </div>
        </div>
    </nav>
</header>

<div th:fragment="flash" class="container pt-3">
    <div class="alert alert-success alert-dismissible fade show" th:if="${success}" role="alert">
        <span th:text="${success}">Thành công</span><button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div class="alert alert-danger alert-dismissible fade show" th:if="${error}" role="alert">
        <span th:text="${error}">Có lỗi</span><button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
</div>

<footer th:fragment="footer" class="footer py-5">
    <div class="container d-flex flex-column flex-md-row justify-content-between align-items-md-end gap-4">
        <div>
            <a class="footer-brand text-decoration-none" th:href="@{/login}"><img th:src="@{/images/logo.svg}" alt=""><span>UTETra</span></a>
            <p class="mb-0">Trà ngon mỗi ngày, kết nối cộng đồng UTE.</p>
        </div>
        <div class="text-md-end"><div class="fw-semibold text-white">Nhóm 03 · UTETra</div></div>
    </div>
</footer>

<th:block th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/app.js}"></script>
</th:block>
</body>
</html>
