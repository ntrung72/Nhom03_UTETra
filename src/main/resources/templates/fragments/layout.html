<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(pageTitle)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${pageTitle} + ' | UTETra'">UTETra</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800;900&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header th:fragment="header">
    <nav class="navbar navbar-expand-lg navbar-dark sticky-top" aria-label="Điều hướng chính">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2 fw-bold" th:href="@{/}">
                <img th:src="@{/images/logo.svg}" alt="UTETra"><span>UTETra</span>
            </a>
            <a class="btn btn-outline-light btn-sm ms-auto me-2" th:href="@{/products}">Sản phẩm</a>
            <div class="d-flex align-items-center gap-2" th:if="${currentUser == null}">
                <a class="btn btn-outline-light btn-sm" th:href="@{/login}">Đăng nhập</a>
                <a class="btn btn-warning btn-sm" th:href="@{/register}">Đăng ký</a>
            </div>
            <div class="dropdown" th:if="${currentUser != null}">
                <a class="btn btn-outline-light dropdown-toggle navbar-user-button" href="#" data-bs-toggle="dropdown">
                    <i class="bi bi-person-fill"></i>
                    <span class="text-truncate" th:text="${currentUser.fullName}">Tài khoản</span>
                </a>
                <ul class="dropdown-menu dropdown-menu-end">
                    <li><span class="dropdown-item-text small text-muted" th:text="${currentUser.role.label}">Vai trò</span></li>
                    <li th:if="${currentUser.role.name() == 'VENDOR'}"><a class="dropdown-item" th:href="@{/vendor}"><i class="bi bi-shop me-2"></i>Kênh người bán</a></li>
                    <li th:if="${currentUser.role.name() == 'USER'}"><a class="dropdown-item" th:href="@{/vendor/register}"><i class="bi bi-shop-window me-2"></i>Đăng ký bán hàng</a></li>
                    <li th:if="${currentUser.role.name() == 'ADMIN' or currentUser.role.name() == 'MANAGER'}"><a class="dropdown-item" th:href="@{/management}"><i class="bi bi-speedometer2 me-2"></i>Quản trị</a></li>
                    <li th:if="${currentUser.role.name() == 'SHIPPER'}"><a class="dropdown-item" th:href="@{/shipper}"><i class="bi bi-truck me-2"></i>Kênh giao hàng</a></li>
                    <li th:if="${currentUser.role.name() == 'USER' or currentUser.role.name() == 'VENDOR'}"><a class="dropdown-item" th:href="@{/user/profile}">Hồ sơ và địa chỉ</a></li>
                    <li th:if="${currentUser.role.name() == 'USER' or currentUser.role.name() == 'VENDOR'}"><a class="dropdown-item" th:href="@{/user/favorites}">Sản phẩm yêu thích</a></li>
                    <li th:if="${currentUser.role.name() == 'USER' or currentUser.role.name() == 'VENDOR'}"><a class="dropdown-item" th:href="@{/user/viewed}">Sản phẩm đã xem</a></li>
                    <li th:if="${currentUser.role.name() == 'USER' or currentUser.role.name() == 'VENDOR'}"><a class="dropdown-item" th:href="@{/cart}">Giỏ hàng</a></li>
                    <li><hr class="dropdown-divider"></li>
                    <li><form th:action="@{/logout}" method="post"><button class="dropdown-item text-danger"><i class="bi bi-box-arrow-right me-2"></i>Đăng xuất</button></form></li>
                </ul>
            </div>
        </div>
    </nav>
</header>

<div th:fragment="flash" class="container pt-3">
    <div class="alert alert-success alert-dismissible fade show" th:if="${success}" role="alert">
        <span th:text="${success}">Thành công</span><button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div class="alert alert-danger alert-dismissible fade show" th:if="${error}" role="alert">
        <span th:text="${error}">Có lỗi</span><button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
</div>

<footer th:fragment="footer" class="footer py-5">
    <div class="container d-flex flex-column flex-md-row justify-content-between align-items-md-end gap-4">
        <div>
            <a class="footer-brand text-decoration-none" th:href="@{/}"><img th:src="@{/images/logo.svg}" alt=""><span>UTETra</span></a>
            <p class="mb-0">Trà ngon mỗi ngày, kết nối cộng đồng UTE.</p>
        </div>
        <div class="text-md-end"><div class="fw-semibold text-white">Nhóm 03 · UTETra</div></div>
    </div>
</footer>

<th:block th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/app.js}"></script>
</th:block>
</body>
</html>
