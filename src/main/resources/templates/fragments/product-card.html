<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>
<div class="col" th:fragment="card(product)">
    <article class="card product-card">
        <a th:href="@{/products/{id}(id=${product.id})}" th:aria-label="|Xem chi tiết ${product.name}|">
            <span class="promotion-badge" th:if="${promotionPrices[product.id] != null and promotionPrices[product.id].promoted}"
                  th:text="|-${promotionPrices[product.id].discountLabel}|">-15%</span>
            <span class="product-stock-badge" th:if="${product.stock <= 0}">Tạm hết hàng</span>
            <img class="card-img-top product-image" th:if="${product.imageUrl != null and !product.imageUrl.isBlank()}" th:src="${product.imageUrl}" th:alt="${product.name}" loading="lazy">
            <span class="product-image-fallback" th:unless="${product.imageUrl != null and !product.imageUrl.isBlank()}"><i class="bi bi-cup-straw" aria-hidden="true"></i></span>
        </a>
        <div class="card-body">
            <h3 class="product-card-title truncate-2"><a class="text-decoration-none text-dark" th:href="@{/products/{id}(id=${product.id})}" th:text="${product.name}">Sản phẩm</a></h3>
            <a class="shop-chip text-decoration-none align-self-start" th:href="@{/shops/{slug}(slug=${product.shop.slug})}" th:text="${product.shop.name}">Shop</a>
            <p class="product-card-description" th:text="${product.description}" th:title="${product.description}">Mô tả sản phẩm</p>
            <div class="product-card-info mt-auto pt-2">
                <div class="product-card-price">
                    <div class="product-price-row" th:if="${promotionPrices[product.id] != null and promotionPrices[product.id].promoted}">
                        <span class="original-price"><span class="visually-hidden">Giá gốc </span><span th:text="${#numbers.formatDecimal(promotionPrices[product.id].originalPrice,0,'POINT',0,'COMMA')} + ' ₫'">45.000 ₫</span></span>
                        <span class="price"><span class="visually-hidden">Giá khuyến mãi </span><span th:text="${#numbers.formatDecimal(promotionPrices[product.id].salePrice,0,'POINT',0,'COMMA')} + ' ₫'">39.000 ₫</span></span>
                    </div>
                    <div class="price" th:unless="${promotionPrices[product.id] != null and promotionPrices[product.id].promoted}"
                         th:text="${#numbers.formatDecimal(product.price,0,'POINT',0,'COMMA')} + ' ₫'">35.000 ₫</div>
                </div>
                <div class="product-card-stats">
                    <span class="rating" th:if="${product.reviewCount > 0}"><i class="bi bi-star-fill" aria-hidden="true"></i> <span th:text="${#numbers.formatDecimal(product.averageRating,1,1)}">4,5</span></span>
                    <span class="product-no-rating" th:unless="${product.reviewCount > 0}"><i class="bi bi-star" aria-hidden="true"></i> Chưa đánh giá</span>
                    <span>Đã bán <strong th:text="${product.soldCount}">0</strong> ly</span>
                </div>
            </div>
        </div>
    </article>
</div>
</body>
</html>
