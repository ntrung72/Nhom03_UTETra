server.port=${PORT:8080}
server.forward-headers-strategy=framework
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=lax

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:2}
spring.datasource.hikari.minimum-idle=1
spring.jpa.hibernate.ddl-auto=validate
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/refund-bank-columns.sql

spring.thymeleaf.cache=true
spring.web.resources.cache.period=3600

app.upload-dir=${UPLOAD_DIR:/home/utetra/uploads}
app.private-upload-dir=${PRIVATE_UPLOAD_DIR:/home/utetra/private-uploads}
app.seed-data=false
app.jwt.secret=${JWT_SECRET}
app.remember-me.key=${REMEMBER_ME_KEY}

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
