# Bước 44 production profile: deploy only against a provisioned, backed-up schema.
# Hibernate validates only. SQL Server schema creation/backfill must be rehearsed separately.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.thymeleaf.cache=true
spring.web.resources.cache.period=3600
app.seed-data=false
app.openapi.public=false
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
# Requires HTTPS, with TLS termination/proxy correctly configured.
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
