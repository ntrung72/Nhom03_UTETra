spring.config.import=optional:file:./application-local.properties
spring.application.name=UTETra
server.port=8090
app.bank-transfer.bank-name=BIDV
app.bank-transfer.bank-bin=970418
app.bank-transfer.account-number=${BANK_TRANSFER_ACCOUNT_NUMBER:6351077536}
app.bank-transfer.account-name=${BANK_TRANSFER_ACCOUNT_NAME:TRAN NAM TRUNG}
app.bank-transfer.expiration-hours=24
app.payos.client-id=${PAYOS_CLIENT_ID:}
app.payos.api-key=${PAYOS_API_KEY:}
app.payos.checksum-key=${PAYOS_CHECKSUM_KEY:}
app.payos.public-base-url=${PUBLIC_BASE_URL:http://localhost:8090}

# SQL Server
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=UTETraDB;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.properties.hibernate.use_nationalized_character_data=true

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.open-in-view=true
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.thymeleaf.cache=false
app.shipper.assignment-reminder-minutes=10
app.shipper.assignment-timeout-minutes=30
spring.web.resources.cache.period=0
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=130MB
app.upload-dir=${UPLOAD_DIR:uploads}
# Bằng chứng giao hàng/trả hàng luôn lưu cục bộ, ngoài đường dẫn public; dùng volume bền vững khi triển khai.
app.private-upload-dir=${PRIVATE_UPLOAD_DIR:private-uploads}

# Gmail: dùng App Password, không dùng mật khẩu Gmail thông thường.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_APP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
app.mail.from=${MAIL_FROM:${MAIL_USERNAME:}}

# Nếu chưa cấu hình Cloudinary, file được lưu cục bộ trong app.upload-dir.
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:1440}
app.remember-me.key=${REMEMBER_ME_KEY:}
app.otp.expiration-minutes=5
app.otp.cooldown-seconds=60
app.otp.max-per-hour=5
app.seed-data=${SEED_DATA:false}
app.loyalty.vnd-per-point=10000

