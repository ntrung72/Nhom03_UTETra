spring.application.name=UTETra
server.port=8090

# SQL Server
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=UTETraDB;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.properties.hibernate.use_nationalized_character_data=true

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.open-in-view=true
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Thymeleaf / Static resources
spring.thymeleaf.cache=false
spring.web.resources.cache.period=0

# UTF-8
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# Gmail: dùng App Password, không dùng mật khẩu Gmail thông thường.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
app.mail.from=${MAIL_FROM:}

# Authentication
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:1440}
app.remember-me.key=${REMEMBER_ME_KEY:}

# OTP
app.otp.expiration-minutes=5
app.otp.cooldown-seconds=60
app.otp.max-per-hour=5

# Multipart upload
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=130MB

# Local upload
app.upload-dir=${UPLOAD_DIR:uploads}

# Cloudinary
# Nếu chưa cấu hình đầy đủ Cloudinary, file được lưu cục bộ.
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# Bước 22: chỉ cho phép các domain tin cậy kết nối WebSocket (không dùng wildcard).
# Ví dụ deploy: WS_ALLOWED_ORIGINS=https://example.com,https://admin.example.com
app.websocket.allowed-origins=${WS_ALLOWED_ORIGINS:http://localhost:8090,http://127.0.0.1:8090}

# VNPay credentials are supplied by the deployment environment.
app.vnpay.payment-url=${VNPAY_PAYMENT_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
app.vnpay.tmn-code=${VNPAY_TMN_CODE:}
app.vnpay.hash-secret=${VNPAY_HASH_SECRET:}
app.vnpay.return-url=${VNPAY_RETURN_URL:http://localhost:8090/payments/vnpay/return}
app.vnpay.expiration-minutes=${VNPAY_EXPIRATION_MINUTES:15}
app.vnpay.expiration-check-ms=${VNPAY_EXPIRATION_CHECK_MS:60000}
app.vnpay.scheduler-enabled=${VNPAY_SCHEDULER_ENABLED:true}

# Tích hợp cuối: chỉ tạo dữ liệu demo trên DB trống khi bật rõ ràng SEED_DATA=true.
app.seed-data=${SEED_DATA:false}

# MoMo Sandbox credentials are supplied only through the environment.
app.momo.endpoint=${MOMO_ENDPOINT:https://test-payment.momo.vn/v2/gateway/api/create}
app.momo.partner-code=${MOMO_PARTNER_CODE:}
app.momo.access-key=${MOMO_ACCESS_KEY:}
app.momo.secret-key=${MOMO_SECRET_KEY:}
app.momo.redirect-url=${MOMO_REDIRECT_URL:http://localhost:8090/payments/momo/return}
app.momo.ipn-url=${MOMO_IPN_URL:http://localhost:8090/payments/momo/ipn}
app.momo.expiration-minutes=${MOMO_EXPIRATION_MINUTES:15}
